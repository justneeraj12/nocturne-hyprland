name: Release bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build deterministic community bundle
        run: ./scripts/build-release-bundle.sh "${GITHUB_REF_NAME#v}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: nocturne-community-${{ github.ref_name }}
          path: dist/*
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
