name: Feature request
description: Propose a focused improvement to the Nocturne workflow
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Explain the user workflow first. Prefer standard Linux backends and replaceable components over a new private service.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
      description: Describe what opens, what stays visible, how it closes and which system service owns the state.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing tools considered
      description: Is there a maintained Wayland utility Nocturne can integrate instead of rebuilding it?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Native shell
        - Hyprland workflow
        - Hardware integration
        - Installer or recovery
        - Documentation
    validations:
      required: true
