name: Feature proposal
description: Propose a focused workflow or platform improvement.
title: "proposal: "
labels: [enhancement, needs-discussion]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Explain the workflow problem before describing the UI., placeholder: "When I… I cannot…"}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behaviour}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Existing Linux tools or alternatives considered}
  - type: checkboxes
    id: principles
    attributes:
      label: NOC principles
      options:
        - label: The feature can remain zero-idle or event-driven.
        - label: It reuses an authoritative Linux service where possible.
        - label: It has a safe rollback or failure path.
