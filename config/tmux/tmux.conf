set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 0
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-kitty:RGB'

set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#07090a,fg=#4d5d58'
set -g status-left-length 28
set -g status-right-length 70
set -g status-left '#[fg=#a7b8b1,bg=#16251f,bold] [#S] #[default]'
set -g status-right '#[fg=#4d5d58]#(whoami)  #[fg=#5f8f76]#H  #[fg=#879a92]%a #(~/.config/hypr/scripts/local-clock | jq -r .text) '
setw -g window-status-format '#[fg=#4d5d58] #I:#W '
setw -g window-status-current-format '#[fg=#a7b8b1,bold] #I:#W '

set -g pane-border-style 'fg=#111719'
set -g pane-active-border-style 'fg=#365c4c'
set -g pane-border-lines single
set -g message-style 'bg=#365c4c,fg=#07090a,bold'

bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Nocturne reloaded'
