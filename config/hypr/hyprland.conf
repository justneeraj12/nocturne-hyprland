# Nocturne Hyprland — keyboard-first, border-only, and still mouse-friendly.

$mod = SUPER
$terminal = kitty
$launcher = $HOME/.config/hypr/scripts/launcher
$control = $HOME/.local/bin/nocturne-settings
$clipboard = $HOME/.config/hypr/scripts/clipboard
$screenshot = $HOME/.config/hypr/scripts/screenshot
$power = $HOME/.config/hypr/scripts/power-menu
$minimize = $HOME/.config/hypr/scripts/minimize
$wallpaper = $HOME/.config/hypr/scripts/wallpaper
$snap = $HOME/.config/hypr/scripts/snap-window
$steam = $HOME/.config/hypr/scripts/steam-launch

source = $HOME/.config/nocturne/accent.conf
source = $HOME/.config/nocturne/theme.conf

# LG UltraGear is the primary screen on the left; the laptop panel follows it.
# The fallback rule also makes hot-plugged displays work without hand editing.
monitor = HDMI-A-1, 1920x1080@180, 0x0, 1
monitor = eDP-1, 1920x1080@144, auto-right, 1
monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11
env = GTK_THEME,Adwaita-dark
env = DCONF_PROFILE,$HOME/.config/dconf/hyprland-profile
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

exec-once = $HOME/.local/bin/nocturne-session-theme hypr
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME QT_QPA_PLATFORMTHEME DCONF_PROFILE
exec-once = hyprpaper -c $HOME/.config/hypr/nocturne-wallpaper.conf
exec-once = systemctl --user start nocturne-wallpaper-cycle.service
exec-once = hypridle
exec-once = swaync
exec-once = waybar
exec-once = /usr/libexec/hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

general {
    gaps_in = $nocturne_gaps_in
    gaps_out = $nocturne_gaps_out
    border_size = $nocturne_border_size
    col.active_border = $active_border
    col.inactive_border = rgba(111719ff)
    resize_on_border = true
    extend_border_grab_area = 12
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = $nocturne_active_opacity
    inactive_opacity = $nocturne_inactive_opacity
    fullscreen_opacity = 1.0
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.18
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true
    bezier = nocturne, 0.16, 1, 0.3, 1
    bezier = quick, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 3, nocturne, popin 97%
    animation = windowsOut, 1, 2, quick, popin 97%
    animation = border, 1, 5, nocturne
    animation = fade, 1, 3, quick
    animation = workspaces, 1, 4, nocturne, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    force_split = 2
}

gesture = 3, horizontal, workspace

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

# Core controls: discoverable in Super+/ and by right-clicking the Ubuntu logo.
bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $launcher
bind = $mod, slash, exec, $HOME/.config/hypr/scripts/help
bind = $mod, R, exec, $control
bind = $mod SHIFT, R, exec, resources
bind = $mod, W, exec, $wallpaper
bind = $mod, E, exec, nautilus --new-window
bind = $mod, B, exec, xdg-open https://www.google.com
bind = $mod, C, exec, chatgpt
bind = $mod, D, exec, code
bind = $mod, T, exec, $steam
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, V, exec, $clipboard
bind = $mod, P, exec, $power
bind = $mod, ESCAPE, exec, hyprlock

bind = $mod, Q, killactive,
bind = $mod, M, exec, $minimize hide
bind = $mod SHIFT, M, exec, $minimize show
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, V, togglefloating,
bind = $mod, A, exec, $snap
bind = $mod, G, togglegroup,
bind = $mod, S, togglespecialworkspace, scratch
bind = $mod SHIFT, S, movetoworkspace, special:scratch
bind = ALT, TAB, cyclenext,
bind = ALT, TAB, bringactivetotop,
bind = $mod, U, togglesplit,
bind = $mod, minus, splitratio, -0.1
bind = $mod, equal, splitratio, 0.1

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, $HOME/.config/hypr/scripts/brightness up
bindel = , XF86MonBrightnessDown, exec, $HOME/.config/hypr/scripts/brightness down
bind = , PRINT, exec, $screenshot full
bind = SHIFT, PRINT, exec, $screenshot area

windowrule = match:class ^(org.gnome.NautilusPreviewer)$, float on
# Full applications belong to the tiling tree. Only true transient dialogs,
# previews and short-lived Steam utility windows are allowed to float below.
windowrule = match:class ^(NocturneVisualizer|com\.nocturne\.Visualizer|com\.nocturne\.Settings|NocturneDashboard|net\.nokyan\.Resources|pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Calculator|com\.github\.wwmm\.easyeffects|org\.rncbc\.qpwgraph|org\.kde\.kdeconnect\.app)$, float off
# Desktop utilities must stay opaque. Their compact surfaces and text lose
# contrast quickly when a bright wallpaper is allowed through the window.
windowrule = match:class ^(com\.nocturne\.Settings|org\.gnome\..*|org\.gtk\..*|org\.kde\..*|net\.nokyan\.Resources|io\.missioncenter\.MissionCenter|pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager|com\.github\.wwmm\.easyeffects|org\.rncbc\.qpwgraph)$, opacity 1.0 override 1.0 override
windowrule = match:class ^(NocturneDashboard)$, opacity 0.98 override 0.98 override
windowrule = match:class ^(NocturneVisualizer|com\.nocturne\.Visualizer)$, opacity 0.99 override 0.99 override
windowrule = match:class ^(firefox|Brave-browser|chromium|mpv)$, idle_inhibit fullscreen
# Steam's library belongs in the tiling layout; only its short-lived utility
# windows float. This also overrides Steam remembering an old floating state.
windowrule = match:class ^(steam)$, match:title ^(Steam)$, float off
windowrule = match:class ^(steam)$, match:title ^(Steam Settings|Friends List|.* - Properties|.* Properties)$, float on
windowrule = match:class ^(steam)$, match:title ^(Steam Settings|Friends List|.* - Properties|.* Properties)$, size 960 720
windowrule = match:class ^(steam)$, match:title ^(Steam Settings|Friends List|.* - Properties|.* Properties)$, center on
windowrule = match:class ^(steam_app_.*)$, immediate yes
# Content, video, document and game windows remain perfectly opaque.
windowrule = match:class ^(firefox|Brave-browser|brave-browser|brave-.*|chromium|Google-chrome|google-chrome|mpv|vlc|org\.gnome\.Evince|org\.gnome\.Papers|libreoffice.*|steam|steam_app_.*)$, opacity 1.0 override 1.0 override

layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.2
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace notifications, blur on
layerrule = match:namespace wofi, blur on
