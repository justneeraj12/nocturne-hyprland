    font_family = Inter Display Medium
    text_align = right
    position = -100, -224
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/lock-media meta
    color = rgba(145, 166, 158, 1.0)
    font_size = 11
    font_family = JetBrains Mono
    text_align = right
