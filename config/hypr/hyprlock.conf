general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.local/share/backgrounds/nocturne-grid.png
    blur_passes = 4
    blur_size = 8
    brightness = 0.28
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(167, 184, 177, 1.0)
    font_size = 86
    font_family = MesloLGS Nerd Font Mono
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = rgba(95, 143, 118, 1.0)
    font_size = 18
    font_family = MesloLGS Nerd Font Mono
    position = 0, 76
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(54, 92, 76, 1.0)
    inner_color = rgba(7, 9, 10, 0.96)
    font_color = rgba(167, 184, 177, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##4d5d58">password</span>
    hide_input = false
    check_color = rgba(95, 143, 118, 1.0)
    fail_color = rgba(155, 91, 91, 1.0)
    position = 0, -80
    halign = center
    valign = center
}
