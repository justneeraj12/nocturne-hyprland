# The only input affordance is a transparent password line, not another card.
label {
    monitor =
    text = $USER  @  NOCTURNE
    color = rgba(145, 166, 158, 1.0)
    font_size = 10
    font_family = JetBrains Mono Medium
    position = -100, -85
    halign = right
    valign = center
}

input-field {
    monitor =
    size = 520, 52
    outline_thickness = 0
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = false
    outer_color = rgba(0, 0, 0, 0.0)
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = rgba(237, 246, 242, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##70847c">TYPE PASSWORD  ·  ENTER TO UNLOCK</span>
    hide_input = false
    check_color = rgba(85, 214, 169, 1.0)
    fail_color = rgba(255, 95, 109, 1.0)
    fail_text = <span foreground="##ff5f6d">ACCESS DENIED  ·  $FAIL  ·  ATTEMPT $ATTEMPTS</span>
    capslock_color = rgba(208, 161, 91, 1.0)
    position = -100, -138
    halign = right
    valign = center
}

shape {
    monitor =
    size = 520, 1
    color = rgba(85, 214, 169, 0.75)
    rounding = 0
    position = -100, -166
    halign = right
    valign = center
}

# All configured family/favorite cities remain visible as one quiet data rail.
shape {
    monitor =
    size = 1728, 1
    color = rgba(85, 214, 169, 0.24)
    rounding = 0
    position = 0, 154
    halign = center
    valign = bottom
}

label {
    monitor =
