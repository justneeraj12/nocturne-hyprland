    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-world
    color = rgba(170, 188, 181, 1.0)
    font_size = 11
    font_family = JetBrains Mono Medium
    text_align = left
    position = 96, 42
    halign = left
    valign = bottom
}
