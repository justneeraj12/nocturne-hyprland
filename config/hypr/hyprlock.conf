general {
    hide_cursor = false
    immediate_render = true
    ignore_empty_input = true
    fail_timeout = 1600
}

background {
    monitor =
    path = ~/.local/state/nocturne/lock-wallpaper
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 1.12
    brightness = 0.31
    vibrancy = 0.18
    vibrancy_darkness = 0.10
}

# Open editorial composition: typography and hairlines, no enclosing console.
label {
    monitor =
    text = NOCTURNE  //  SESSION SECURED
    color = rgba(85, 214, 169, 1.0)
    font_size = 11
    font_family = JetBrains Mono Medium
    position = 96, -52
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/lock-status
    color = rgba(164, 183, 175, 1.0)
    font_size = 10
    font_family = JetBrains Mono
    text_align = right
    position = -96, -52
    halign = right
    valign = top
}

shape {
    monitor =
    size = 2, 224
    color = rgba(85, 214, 169, 0.70)
    rounding = 0
    position = 76, 132
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock-time
    color = rgba(237, 246, 242, 1.0)
    font_size = 136
    font_family = Inter Display SemiBold
    position = 100, 166
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-date
    color = rgba(225, 235, 231, 1.0)
    font_size = 18
    font_family = JetBrains Mono Medium
    position = 108, 45
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:300000] ~/.config/hypr/scripts/lock-weather
    color = rgba(208, 161, 91, 1.0)
    font_size = 13
    font_family = JetBrains Mono Medium
    position = 108, -2
    halign = left
    valign = center
}

# Media and notification context stays glanceable without exposing message text.
