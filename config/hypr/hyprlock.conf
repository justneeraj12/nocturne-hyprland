general {
    hide_cursor = false
    immediate_render = true
    ignore_empty_input = true
    fail_timeout = 1600
}

background {
    monitor =
    path = ~/.local/state/nocturne/lock-wallpaper
    blur_passes = 4
    blur_size = 7
    noise = 0.018
    contrast = 1.16
    brightness = 0.28
    vibrancy = 0.16
    vibrancy_darkness = 0.08
}

# Sharp security console: clear input feedback without hiding the wallpaper.
shape {
    monitor =
    size = 760, 520
    color = rgba(5, 8, 9, 0.94)
    rounding = 0
    border_size = 2
    border_color = rgba(49, 83, 69, 1.0)
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 8, 520
    color = rgba(85, 214, 169, 1.0)
    rounding = 0
    position = -376, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 760, 3
    color = rgba(49, 83, 69, 1.0)
    rounding = 0
    position = 0, 258
    halign = center
    valign = center
}

shape {
    monitor =
    size = 138, 3
    color = rgba(196, 154, 87, 1.0)
    rounding = 0
    position = -311, -258
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾  NOCTURNE::AUTH_GATE
    color = rgba(225, 235, 231, 1.0)
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = -238, 215
    halign = center
    valign = center
}

label {
    monitor =
    text = [ SECURE CHANNEL // 01 ]
    color = rgba(85, 214, 169, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 258, 215
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock-time
    color = rgba(225, 235, 231, 1.0)
    font_size = 82
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  //  %d %B %Y"
    color = rgba(109, 149, 120, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 61
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER@NOCTURNE  //  SESSION ENCRYPTED
    color = rgba(196, 154, 87, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 14
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 500, 64
    outline_thickness = 2
    rounding = 0
    dots_size = 0.28
    dots_spacing = 0.30
    dots_center = true
    outer_color = rgba(49, 83, 69, 1.0)
    inner_color = rgba(8, 13, 14, 1.0)
    font_color = rgba(225, 235, 231, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##6d8178">[ TYPE PASSWORD ]</span>
    hide_input = false
    check_color = rgba(85, 214, 169, 1.0)
    fail_color = rgba(255, 95, 109, 1.0)
    fail_text = <span foreground="##ff5f6d">ACCESS DENIED // $FAIL ($ATTEMPTS)</span>
    capslock_color = rgba(196, 154, 87, 1.0)
    position = 0, -58
    halign = center
    valign = center
}

label {
    monitor =
    text = KEYBOARD READY  //  TYPE DIRECTLY  //  ENTER TO UNLOCK
    color = rgba(130, 149, 141, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -112
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/lock-status
    color = rgba(109, 149, 120, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -170
    halign = center
    valign = center
}

label {
    monitor =
    text = [ ESCAPE CANNOT DISMISS ]  //  [ PASSWORDS ARE NEVER LOGGED ]
    color = rgba(77, 93, 88, 1.0)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 0, -220
    halign = center
    valign = center
}
