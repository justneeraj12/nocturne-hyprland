general {
    hide_cursor = true
    immediate_render = true
    grace = 0
}

background {
    monitor =
    path = ~/.local/share/backgrounds/nocturne-grid.png
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 1.10
    brightness = 0.20
    vibrancy = 0.12
    vibrancy_darkness = 0.05
}

# Square terminal-authentication chassis.
shape {
    monitor =
    size = 640, 430
    color = rgba(7, 9, 10, 0.90)
    rounding = 0
    border_size = 2
    border_color = rgba(54, 92, 76, 0.95)
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 640, 3
    color = rgba(109, 149, 120, 1.0)
    rounding = 0
    position = 0, 213
    halign = center
    valign = center
}

shape {
    monitor =
    size = 112, 3
    color = rgba(196, 154, 87, 1.0)
    rounding = 0
    position = -264, -213
    halign = center
    valign = center
}

label {
    monitor =
    text = NOCTURNE::SECURE_SESSION
    color = rgba(213, 223, 219, 1.0)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -188, 178
    halign = center
    valign = center
}

label {
    monitor =
    text = [ AUTH CHANNEL / 01 ]
    color = rgba(95, 195, 188, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 206, 178
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock-time
    color = rgba(213, 223, 219, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 88
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  //  %d %B %Y"
    color = rgba(109, 149, 120, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 34
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER@NOCTURNE  //  SESSION ENCRYPTED
    color = rgba(196, 154, 87, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -18
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 56
    outline_thickness = 2
    rounding = 0
    dots_size = 0.20
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(54, 92, 76, 1.0)
    inner_color = rgba(11, 15, 16, 1.0)
    font_color = rgba(213, 223, 219, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##4d5d58">[ ENTER PASSWORD ]</span>
    hide_input = false
    check_color = rgba(95, 195, 188, 1.0)
    fail_color = rgba(184, 104, 134, 1.0)
    fail_text = <span foreground="##b86886">AUTH FAILED // $FAIL ($ATTEMPTS)</span>
    capslock_color = rgba(196, 154, 87, 1.0)
    position = 0, -82
    halign = center
    valign = center
}

label {
    monitor =
    text = TYPE TO DECRYPT  //  ENTER TO AUTHENTICATE
    color = rgba(77, 93, 88, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -137
    halign = center
    valign = center
}

label {
    monitor =
    text = [ LOCKED ]  PIPEWIRE::IDLE  NETWORK::GUARDED
    color = rgba(77, 93, 88, 1.0)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 0, -184
    halign = center
    valign = center
}
